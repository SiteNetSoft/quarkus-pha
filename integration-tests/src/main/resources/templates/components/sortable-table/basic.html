{! Sortable table — column sorting, text filtering, and pagination all run on the server; every interaction
   is a fragment request to /api/htmx/data-table. The search box stays put while the results swap. !}
<div style="max-width: 640px">
  <div class="pf-v6-c-toolbar" style="margin-bottom: 0.5rem">
    <div class="pf-v6-c-toolbar__content">
      <div class="pf-v6-c-toolbar__content-section">
        <div class="pf-v6-c-toolbar__item">
          <div class="pf-v6-c-text-input-group">
            <div class="pf-v6-c-text-input-group__main pf-m-icon">
              <span class="pf-v6-c-text-input-group__text">
                <span class="pf-v6-c-text-input-group__icon">{icons:svg('fa:magnifying-glass').raw}</span>
                <input
                  type="search"
                  class="pf-v6-c-text-input-group__text-input"
                  id="htmx-dt-search"
                  name="q"
                  placeholder="Filter users..."
                  aria-label="Filter users"
                  hx-get="/api/htmx/data-table"
                  hx-trigger="keyup changed delay:300ms, search"
                  hx-target="#htmx-dt-results"
                  hx-swap="outerHTML"
                />
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="htmx-dt-results" hx-get="/api/htmx/data-table" hx-trigger="load" hx-swap="outerHTML">
    <p class="pf-v6-c-content--small">Loading users…</p>
  </div>
</div>
