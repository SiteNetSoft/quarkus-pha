{! PF parity: react-core 6.6.0 LabelGroupEditableAddDropdown — an editable label group whose
   overflow-style "Add label" control opens a menu of preset label texts; selecting one prepends it
   to the group and every label stays removable. !}
<div
  x-data="{ open: false, next: 4, labels: [{ id: 0, name: 'Label 1' }, { id: 1, name: 'Label 2' }, { id: 2, name: 'Label 3' }],
    add(text) { this.labels.unshift({ id: this.next, name: text }); this.next = this.next + 1; this.open = false; } }"
  id="lbg-add-dropdown"
>
  <div class="pf-v6-c-label-group pf-m-category pf-m-editable" role="group" aria-label="Label group 1">
    <div class="pf-v6-c-label-group__main">
      <span class="pf-v6-c-label-group__label" aria-hidden="true">Label group 1</span>
      <ul class="pf-v6-c-label-group__list" role="list">
        <template x-for="l in labels" :key="l.id">
          <li class="pf-v6-c-label-group__list-item">
            <span class="pf-v6-c-label pf-m-blue">
              <span class="pf-v6-c-label__content"><span class="pf-v6-c-label__text" x-text="l.name"></span></span>
              <span class="pf-v6-c-label__actions">
                <button
                  class="pf-v6-c-button pf-m-plain pf-m-no-padding"
                  type="button"
                  :aria-label="'Remove ' + l.name"
                  @click="labels = labels.filter((x) => x.id !== l.id)"
                >
                  <span class="pf-v6-c-button__icon">{icons:svg('fa:xmark').raw}</span>
                </button>
              </span>
            </span>
          </li>
        </template>
        <li class="pf-v6-c-label-group__list-item" style="position: relative">
          <button class="pf-v6-c-label pf-m-overflow" type="button" :aria-expanded="open.toString()" @click="open = !open">
            <span class="pf-v6-c-label__content"><span class="pf-v6-c-label__text">Add label</span></span>
          </button>
          <div
            class="pf-v6-c-menu"
            x-show="open"
            x-cloak
            @click.outside="open = false"
            style="position: absolute; top: 100%; left: 0; z-index: 200; width: max-content"
          >
            <div class="pf-v6-c-menu__content">
              <ul class="pf-v6-c-menu__list" role="menu">
                <template x-for="opt in ['Label text 1', 'Label text 2', 'Label text 3', 'Label text 4']" :key="opt">
                  <li role="none" class="pf-v6-c-menu__list-item">
                    <button class="pf-v6-c-menu__item" type="button" role="menuitem" @click="add(opt)">
                      <span class="pf-v6-c-menu__item-main"><span class="pf-v6-c-menu__item-text" x-text="opt"></span></span>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
