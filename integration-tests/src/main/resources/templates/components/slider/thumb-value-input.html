{! PF parity: react-core 6.6.0 SliderThumbValueInput — the editable value input floats above the
   thumb (pf-m-floating) instead of sitting beside the rail; typed values clamp to 0–100. !}
<div
  class="pf-v6-c-slider"
  id="sl-thumb-value-input"
  x-data="{ val: 50, clamp(v) { this.val = Math.max(0, Math.min(100, Math.floor(Number(v) || 0))); } }"
  :style="'--pf-v6-c-slider--value: ' + val + '%'"
  style="--pf-v6-c-slider--value: 50%; margin-top: 3.5rem"
>
  <div class="pf-v6-c-slider__main">
    <div
      class="pf-v6-c-slider__rail"
      @click="clamp(Math.round((($event.clientX - $el.getBoundingClientRect().left) / $el.getBoundingClientRect().width) * 100))"
    >
      <div class="pf-v6-c-slider__rail-track"></div>
    </div>
    <div
      class="pf-v6-c-slider__thumb"
      role="slider"
      tabindex="0"
      aria-label="Value"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="50"
      :aria-valuenow="val"
      :style="'left: ' + val + '%'"
      @keydown="((($event.key === 'ArrowRight' || $event.key === 'ArrowUp') && ($event.preventDefault(), val = Math.min(100, val + 1))), (($event.key === 'ArrowLeft' || $event.key === 'ArrowDown') && ($event.preventDefault(), val = Math.max(0, val - 1))))"
    ></div>
    <div class="pf-v6-c-slider__value pf-m-floating">
      <div class="pf-v6-c-input-group">
        <div class="pf-v6-c-input-group__item pf-m-fill">
          <span class="pf-v6-c-form-control">
            <input
              type="number"
              aria-label="Slider value input"
              :value="val"
              @change="clamp($event.target.value)"
            />
          </span>
        </div>
        <div class="pf-v6-c-input-group__item pf-m-box">
          <span class="pf-v6-c-input-group__text">%</span>
        </div>
      </div>
    </div>
  </div>
</div>
