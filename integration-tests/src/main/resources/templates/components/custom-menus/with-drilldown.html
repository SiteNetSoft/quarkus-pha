{! PF parity: react-core 6.6.0 demos/CustomMenus/DrilldownMenuDemo.tsx — a toggle-attached drilldown
   menu, three levels deep. Alpine keeps the drill path as a stack; opening the toggle resets it.
   The content gets a fixed height because PF's JS normally measures the active level. !}
<div
  x-data="{ open: false, path: [], drill(id) { this.path.push(id); }, back() { this.path.pop(); } }"
  @keydown.escape="open = false"
  style="position: relative; display: inline-block"

    class="pf-v6-c-menu-toggle"
    type="button"
    :class="open ? 'pf-m-expanded' : ''"
    :aria-expanded="open"
    @click="open = !open; path = []"
    id="cm-drilldown-toggle"
  >
    <span class="pf-v6-c-menu-toggle__text" x-text="open ? 'Expanded' : 'Collapsed'"></span>
    <span class="pf-v6-c-menu-toggle__controls"
      ><span class="pf-v6-c-menu-toggle__toggle-icon">{icons:svg('fa:caret-down').raw}</span></span
    >
  </button>
