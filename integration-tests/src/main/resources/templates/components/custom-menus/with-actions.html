{! PF parity: react-core 6.6.0 demos/CustomMenus/ActionsMenuDemo.tsx — a Select-composed menu whose
   items carry icon actions; multi-select keeps the menu open, chosen items get a check. !}
<div
  x-data="{
    open: false,
    sel: [],
    has(i) { return this.sel.indexOf(i) !== -1; },
    tog(i) { if (this.has(i)) { this.sel = this.sel.filter(function (s) { return s !== i; }); } else { this.sel.push(i); } }
  }"
  @keydown.escape="open = false"
  style="position: relative; display: inline-block"
>
  <button
    class="pf-v6-c-menu-toggle"
    type="button"
    :class="open ? 'pf-m-expanded' : ''"
    :aria-expanded="open"
    @click="open = !open"
    id="cm-actions-toggle"
  >
    <span class="pf-v6-c-menu-toggle__text" x-text="open ? 'Expanded' : 'Collapsed'"></span>
    <span class="pf-v6-c-menu-toggle__controls"
      ><span class="pf-v6-c-menu-toggle__toggle-icon">{icons:svg('fa:caret-down').raw}</span></span
    >
  </button>
  <div
    class="pf-v6-c-menu"
    x-show="open"
    x-cloak
    @click.outside="open = false"
    style="position: absolute; top: 100%; left: 0; z-index: 200; min-width: 18rem"
  >
    <div class="pf-v6-c-menu__content">
      <section class="pf-v6-c-menu__group">
        <h4 class="pf-v6-c-menu__group-title">Actions</h4>
        <ul class="pf-v6-c-menu__list" role="listbox">
          <li class="pf-v6-c-menu__list-item" :class="has(0) ? 'pf-m-selected' : ''">
            <button class="pf-v6-c-menu__item" type="button" role="option" :aria-selected="has(0)" @click="tog(0)">
              <span class="pf-v6-c-menu__item-main">
                <span class="pf-v6-c-menu__item-text">Item 1</span>
                <span class="pf-v6-c-menu__item-select-icon" x-show="has(0)">{icons:svg('fa:check').raw}</span>
                </span><span class="pf-v6-c-menu__item-description">This is a description</span>
            </button>
            <button class="pf-v6-c-button pf-m-plain pf-v6-c-menu__item-action" type="button" aria-label="Code">
              <span class="pf-v6-c-menu__item-action-icon">{icons:svg('fa:code-branch').raw}</span>
            </button>
          </li>
          <li class="pf-v6-c-menu__list-item pf-m-disabled">
            <button class="pf-v6-c-menu__item pf-m-disabled" type="button" role="option" disabled aria-disabled="true">
              <span class="pf-v6-c-menu__item-main">
                <span class="pf-v6-c-menu__item-text">Item 2</span>
                </span><span class="pf-v6-c-menu__item-description">This is a description</span>
            </button>
            <button
              class="pf-v6-c-button pf-m-plain pf-v6-c-menu__item-action"
              type="button"
              aria-label="Alert"
              disabled
              aria-disabled="true"
            >
              <span class="pf-v6-c-menu__item-action-icon">{icons:svg('fa:bell').raw}</span>
            </button>
          </li>
          <li class="pf-v6-c-menu__list-item" :class="has(2) ? 'pf-m-selected' : ''">
            <button class="pf-v6-c-menu__item" type="button" role="option" :aria-selected="has(2)" @click="tog(2)">
              <span class="pf-v6-c-menu__item-main">
                <span class="pf-v6-c-menu__item-text">Item 3</span>
                <span class="pf-v6-c-menu__item-select-icon" x-show="has(2)">{icons:svg('fa:check').raw}</span>
              </span>
            </button>
            <button class="pf-v6-c-button pf-m-plain pf-v6-c-menu__item-action" type="button" aria-label="Copy">
              <span class="pf-v6-c-menu__item-action-icon">{icons:svg('fa:clipboard').raw}</span>
            </button>
          </li>
          <li class="pf-v6-c-menu__list-item" :class="has(3) ? 'pf-m-selected' : ''">
            <button class="pf-v6-c-menu__item" type="button" role="option" :aria-selected="has(3)" @click="tog(3)">
              <span class="pf-v6-c-menu__item-main">
                <span class="pf-v6-c-menu__item-text">Item 4</span>
                <span class="pf-v6-c-menu__item-select-icon" x-show="has(3)">{icons:svg('fa:check').raw}</span>
                </span><span class="pf-v6-c-menu__item-description">This is a description</span>
            </button>
            <button class="pf-v6-c-button pf-m-plain pf-v6-c-menu__item-action" type="button" aria-label="Expand">
              <span class="pf-v6-c-menu__item-action-icon">{icons:svg('fa:bars').raw}</span>
            </button>
          </li>
        </ul>
      </section>
    </div>
  </div>
</div>
