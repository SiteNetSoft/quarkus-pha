{! Live search — queries the server on each keystroke (300 ms debounce); results swap into the menu below. !}
<div style="max-width: 400px">
  {#include components/htmx/live-search id="htmx-search" searchUrl="/api/htmx/search" targetId="search-results"
  placeholder="Search infrastructure..." /}
</div>
<div class="pf-v6-c-menu" style="max-width: 400px; margin-top: 0.5rem">
  <div class="pf-v6-c-menu__content">
    <ul class="pf-v6-c-menu__list" id="search-results" role="listbox" aria-label="Search results">
      <li role="option" class="pf-v6-c-menu__list-item">
        <div class="pf-v6-c-menu__item">
          <span class="pf-v6-c-menu__item-main"><span class="pf-v6-c-menu__item-text">Type to search...</span></span>
        </div>
      </li>
    </ul>
  </div>
</div>
