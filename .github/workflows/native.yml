name: Native

# Weekly native-image build + smoke: native compat rots silently as dependencies
# change, and the per-push pipeline never builds it. The smoke exercises the two
# native-fragile paths on top of page 200s — Jackson's reflective model binding
# (the JSON view-model contract) and PhaTemplateLocator's runtime resource reads
# (the pha: template-URI scheme).
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch: # registered once the file reaches the default branch
  push:
    branches: [develop]
    paths: [".github/workflows/native.yml", "scripts/native-smoke.sh"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Vendor frontend dependencies
        run: bash scripts/download-frontend-deps.sh

      - name: Build native image
        run: >
          ./gradlew :quarkus-pha-integration-tests:quarkusBuild
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.native-image-xmx=8g

      - name: Native smoke
        run: bash scripts/native-smoke.sh
