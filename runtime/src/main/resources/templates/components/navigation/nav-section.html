{! Nav section — one grouped-nav block (title + its list) for the nav component's grouped slot mode. !} {! Required:
title. !} {! Slot: {#items} — the section's list-item entries; compose nav-item / nav-item-expandable includes. !}
<section class="pf-v6-c-nav__section">
  <h2 class="pf-v6-c-nav__section-title">{title}</h2>
  <ul class="pf-v6-c-nav__list" role="list">
    {#let title=null}{#insert items}{/insert}{/let}
  </ul>
</section>
